
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Sederhana</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #1e40af;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        main {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px #00000010;
        }

        h2 {
            margin-bottom: 15px;
        }

        p {
            line-height: 1.6;
            margin-bottom: 20px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #1e293b;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Website Pertamaku</h1>
        <p>Belajar Membuat Website dengan HTML</p>
    </header>

    <nav>
        <a href="#beranda">Beranda</a>
        <a href="#tentang">Tentang</a>
        <a href="#kontak">Kontak</a>
    </nav>

    <main>
        <section class="card" id="beranda">
            <h2>Halo, Selamat Datang! 👋</h2>

            <p>
                Ini adalah website sederhana yang dibuat
                menggunakan HTML, CSS, dan JavaScript.
                Ayo mulai belajar coding!
            </p>

            <button onclick="sapaPengunjung()">
                Klik Saya
            </button>

            <p id="pesan"></p>
        </section>
    </main>

    <footer id="kontak">
        <p>© 2026 Website Pertamaku</p>
    </footer>

    <script>
        function sapaPengunjung() {
            document.getElementById("pesan").innerHTML =
                "🔥 Semangat belajar coding, bro!";
        }
    </script>

</body>
</html>
